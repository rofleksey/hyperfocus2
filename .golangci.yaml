version: "2"
run:
  timeout: 5m
  go: "1.26"

linters:
  default: none
  enable:
    - errcheck
    - gocritic
    - govet
    - ineffassign
    - revive
    - staticcheck
    - unused
  settings:
    revive:
      rules:
        # Doc-commenting every exported symbol is noise for this project.
        - name: exported
          disabled: true

formatters:
  enable:
    - gofmt
    - goimports

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
  exclusions:
    paths:
      - "web/"
